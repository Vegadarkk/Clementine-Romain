<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="darkreader-lock"><meta name="color-scheme" content="only light"><title>b-m</title><style>@font-face { font-family: "Pinyon Script"; src: url(../fonts/pinyon-script-latin-400-normal.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "Cormorant Garamond"; font-weight: 500; src: url(../fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; src: url(../fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "Jost"; font-weight: 400; src: url(../fonts/jost-latin-400-normal.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "Jost"; font-weight: 500; src: url(../fonts/jost-latin-500-normal.woff2) format("woff2"); font-display: block; }
body { margin: 0; background: #FFF3E6; }

/* ======================================================= Commun */
.pr { position: relative; overflow: hidden; font-family: "Jost", system-ui, sans-serif; color: #2F3829; background: #FFF3E6; -webkit-font-smoothing: antialiased; }
.pr *, .pr *::before, .pr *::after { box-sizing: border-box; }
.pr p { margin: 0; }
.pr button { font: inherit; color: inherit; }
.pr .site { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pr .gate { position: absolute; inset: 0; }
.pr .over { font: 500 11px/1.3 "Jost", sans-serif; letter-spacing: .36em; text-transform: uppercase; color: #A3144D; }
.pr .names { font-family: "Pinyon Script", cursive; font-weight: 400; line-height: 1.12; color: #2F3829; white-space: nowrap; }
.pr .names span { color: #C2185B; }
.pr .date { font: italic 500 19px/1.4 "Cormorant Garamond", Georgia, serif; color: #5B6352; }
.pr .open { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 30px; border: 0; border-radius: 999px; background: #C2185B; color: #FFF9F2; font: 500 12.5px/1 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; box-shadow: 0 14px 30px -14px rgba(194, 24, 91, .75); }
.pr .open svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pr .note { margin-top: 12px; font-size: 12.5px; color: #5B6352; }
.pr .silent { margin-top: 4px; padding: 8px 12px; border: 0; background: none; color: #5B6352; font-size: 13px; text-decoration: underline; text-underline-offset: .22em; cursor: pointer; }
.pr .replay { position: absolute; right: 18px; bottom: 18px; z-index: 30; display: none; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border: 1px solid rgba(47, 56, 41, .18); border-radius: 999px; background: rgba(255, 249, 242, .92); color: #2F3829; font: 500 11.5px/1 "Jost", sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 24px -14px rgba(47, 56, 41, .5); }
.pr .replay svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pr.stage-done .replay { display: inline-flex; animation: fade-in .5s both; }
.pr.stage-done .gate { display: none; }

/* Fleurs d'angle */
.pr .fl { position: absolute; height: auto; pointer-events: none; }

/* Pétales qui tombent */
.pr .petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pr .petals i { position: absolute; top: -40px; display: block; border-radius: 80% 0 55% 50% / 55% 0 80% 50%; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); }
  25% { transform: translate3d(34px, calc(var(--h) * .25), 0) rotate(90deg); }
  50% { transform: translate3d(-10px, calc(var(--h) * .5), 0) rotate(190deg); }
  75% { transform: translate3d(28px, calc(var(--h) * .75), 0) rotate(270deg); }
  100% { transform: translate3d(0, calc(var(--h) + 80px), 0) rotate(360deg); }
}

/* Cachet de cire : deux moitiés (cassure dentelée) qui se séparent à l'ouverture */
.pr .seal { position: absolute; z-index: 8; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.pr .seal-in { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.pr .seal:hover .seal-in { transform: scale(1.045) rotate(-2deg); }
.pr .seal:focus-visible { outline: 2px solid #C2185B; outline-offset: 6px; }
.pr .half, .pr .whole { position: absolute; inset: 0; }
.pr .half { visibility: hidden; }
.pr.stage-open .half { visibility: visible; }
.pr.stage-open .whole { visibility: hidden; }
.pr .half img, .pr .whole img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 9px 10px rgba(78, 6, 35, .3)) drop-shadow(0 2px 2px rgba(78, 6, 35, .32)); }
.pr .half--l { clip-path: polygon(-30% -30%, 52% -30%, 51% 8%, 47% 20%, 54% 33%, 45% 47%, 53% 61%, 47% 74%, 52% 88%, 50% 130%, -30% 130%); }
.pr .half--r { clip-path: polygon(52% -30%, 130% -30%, 130% 130%, 50% 130%, 52% 88%, 47% 74%, 53% 61%, 45% 47%, 54% 33%, 47% 20%, 51% 8%); }
.pr .sheen { position: absolute; inset: 12%; border-radius: 50%; overflow: hidden; pointer-events: none; }
.pr .sheen::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); transform: skewX(-18deg); animation: glint 6s ease-in-out 3.2s infinite; }
@keyframes glint { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.pr .ripple { position: absolute; z-index: 7; border: 1.5px solid rgba(194, 24, 91, .45); border-radius: 50%; opacity: 0; pointer-events: none; }
.pr .crumb { position: absolute; z-index: 9; width: var(--s, 6px); height: var(--s, 6px); border-radius: 45% 55% 50% 50%; background: radial-gradient(circle at 35% 30%, #E0457F, #8E0E42 75%); opacity: 0; pointer-events: none; }

@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(14px); } }
@keyframes ink { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% -2% -20% 0); } }
@keyframes bloom { from { opacity: 0; transform: var(--r0) scale(.55); } to { opacity: var(--o, 1); transform: var(--r1) scale(1); } }
@keyframes stamp {
  0% { opacity: 0; transform: translateY(-26px) scale(1.9) rotate(-16deg); }
  55% { opacity: 1; transform: translateY(0) scale(.95) rotate(0); }
  75% { transform: scale(1.02); }
  100% { opacity: 1; transform: none; }
}
@keyframes ripple { 0% { opacity: .75; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes pulse { 0% { box-shadow: 0 14px 30px -14px rgba(194, 24, 91, .75), 0 0 0 0 rgba(194, 24, 91, .42); } 70%, 100% { box-shadow: 0 14px 30px -14px rgba(194, 24, 91, .75), 0 0 0 18px rgba(194, 24, 91, 0); } }
@keyframes ui-out { to { opacity: 0; transform: translateY(10px); visibility: hidden; } }
@keyframes press { 0% { transform: none; } 100% { transform: scale(.93); } }
@keyframes break-l { 0% { transform: none; opacity: 1; } 35% { transform: translate(-10px, -4px) rotate(-8deg); opacity: 1; } 100% { transform: translate(-46px, 120px) rotate(-38deg); opacity: 0; } }
@keyframes break-r { 0% { transform: none; opacity: 1; } 35% { transform: translate(10px, -3px) rotate(7deg); opacity: 1; } 100% { transform: translate(40px, 136px) rotate(30deg); opacity: 0; } }
@keyframes crumb { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 45% { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .6 - 14px)) scale(.9); } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 40px)) scale(.5); } }
@keyframes site-in { from { transform: scale(1.06); } to { transform: none; } }
@keyframes gate-out { to { opacity: 0; visibility: hidden; } }

/* Entrée commune */
.pr.stage-idle .fl { animation: bloom 1.8s cubic-bezier(.34, 1.3, .64, 1) both; }
.pr.stage-idle .seal { animation: stamp .75s cubic-bezier(.3, .7, .2, 1) both; }
.pr.stage-idle .ripple { animation: ripple 1.1s cubic-bezier(.2, .7, .3, 1) forwards; }
.pr.stage-idle .open { animation: fade-up .9s cubic-bezier(.2, .8, .2, 1) both, pulse 2.6s cubic-bezier(.2, .8, .2, 1) infinite; }

/* Ouverture commune : boutons qui s'effacent, cachet qui se brise */
.pr.stage-open .ui > *, .pa.stage-open .date { animation: ui-out .4s ease-in both; }
.pr.stage-open .seal { pointer-events: none; }
.pr.stage-open .seal-in { animation: press .14s ease-out both; }
.pr.stage-open .half--l { animation: break-l .9s .14s cubic-bezier(.45, 0, .6, 1) both; }
.pr.stage-open .half--r { animation: break-r .95s .14s cubic-bezier(.45, 0, .6, 1) both; }
.pr.stage-open .sheen { display: none; }
.pr.stage-open .crumb { animation: crumb .85s .16s cubic-bezier(.2, .6, .4, 1) both; }
.pr.stage-open .petals { animation: gate-out .6s 1s both; }

/* ======================================================= A · L'enveloppe */
.pa .gate { background: radial-gradient(70% 62% at 50% 44%, #FFFBF6, #FFF3E6 70%, #FDE6DA); }
.pa .col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.pa .ui { display: flex; flex-direction: column; align-items: center; }
.pa .env-wrap { position: relative; }
.pa .env-scale { position: absolute; left: 0; top: 0; width: 440px; height: 300px; transform-origin: 0 0; }
.pa .env-rise, .pa .env-float { position: absolute; inset: 0; }
.pa .env-back { position: absolute; inset: 0; z-index: 1; border-radius: 12px; background: radial-gradient(circle at 25% 25%, rgba(194, 24, 91, .16) 0 1.6px, transparent 2.2px) 0 0 / 16px 16px, radial-gradient(circle at 75% 75%, rgba(255, 255, 255, .55) 0 1.3px, transparent 1.9px) 0 0 / 16px 16px, linear-gradient(165deg, #FBDCE5, #F2BCCD); box-shadow: 0 40px 60px -36px rgba(96, 44, 32, .55), 0 14px 26px -18px rgba(96, 44, 32, .35); }
.pa .env-card { position: absolute; left: 22px; right: 22px; top: 14px; height: 270px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 20px; border-radius: 6px; background: linear-gradient(180deg, #FFFEFB, #FFF7EE); box-shadow: 0 1px 2px rgba(80, 50, 30, .1), 0 12px 26px -16px rgba(80, 50, 30, .35); text-align: center; }
.pa .env-card::before { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(194, 24, 91, .3); border-radius: 3px; }
.pa .env-card::after { content: ""; position: absolute; inset: 13px; border: 1px solid rgba(194, 24, 91, .14); border-radius: 2px; }
.pa .env-card .mono { width: 54px; height: auto; margin-bottom: 2px; }
.pa .env-card .cn { font-family: "Pinyon Script", cursive; font-size: 33px; line-height: 1.15; color: #2F3829; }
.pa .env-card .cn span { color: #C2185B; }
.pa .env-card .ct { font: 500 9px/1.6 "Jost", sans-serif; letter-spacing: .28em; text-transform: uppercase; color: #6B7F5E; }
.pa .env-card .cd { font: italic 500 17px/1.3 "Cormorant Garamond", Georgia, serif; color: #A3144D; }
.pa .env-pocket { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; display: block; }
.pa .env-flapwrap { position: absolute; left: 0; top: 0; z-index: 4; width: 100%; height: 176px; }
.pa .env-flap { position: absolute; inset: 0; transform-origin: 50% 0; transform: perspective(1100px) rotateX(0deg); }
.pa .env-flap .flap-img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 5px 5px rgba(96, 60, 36, .16)); }
.pa .env-flap .liner { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 53.6% 93.2%, 50% 100%, 46.4% 93.2%); background: radial-gradient(circle at 25% 25%, rgba(194, 24, 91, .16) 0 1.6px, transparent 2.2px) 0 0 / 16px 16px, radial-gradient(circle at 75% 75%, rgba(255, 255, 255, .55) 0 1.3px, transparent 1.9px) 0 0 / 16px 16px, linear-gradient(15deg, #FBDCE5, #F2BCCD); opacity: 0; }
.pa .seal { left: 160px; top: 104px; width: 120px; height: 120px; }
.pa .ripple { left: 160px; top: 104px; width: 120px; height: 120px; }
.pa .crumb { left: 217px; top: 161px; }

/* A · entrée */
.pa.stage-idle .over { animation: fade-in 1s .2s both; }
.pa.stage-idle .names { animation: ink 1.6s .35s cubic-bezier(.6, 0, .3, 1) both; }
.pa.stage-idle .env-rise { animation: env-rise 1.4s .35s cubic-bezier(.2, .8, .2, 1) both; }
.pa.stage-idle .env-float { animation: env-float 7s 1.8s ease-in-out infinite; }
.pa.stage-idle .seal { animation-delay: 1.25s; }
.pa.stage-idle .ripple { animation-delay: 1.62s; }
.pa.stage-idle .date { animation: fade-up .9s 1.75s cubic-bezier(.2, .8, .2, 1) both; }
.pa.stage-idle .open { animation-delay: 1.95s, 3.2s; }
.pa.stage-idle .note { animation: fade-in .8s 2.15s both; }
.pa.stage-idle .silent { animation: fade-in .8s 2.25s both; }
.pa.stage-idle .fl1 { animation-delay: .25s; }
.pa.stage-idle .fl2 { animation-delay: .45s; }
@keyframes env-rise { from { opacity: 0; transform: translateY(54px) rotate(-4deg); } to { opacity: 1; transform: rotate(-1.2deg); } }
@keyframes env-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(.8deg); } }

/* A · ouverture : le cachet se brise, le rabat s'ouvre, la carte sort, puis tout s'efface sur le site */
.pa.stage-open .env-rise { transform: rotate(-1.2deg); }
.pa.stage-open .env-float { animation: env-float 7s 1.8s ease-in-out infinite; animation-play-state: paused; }
.pa.stage-open .env-flap { animation: flap-open 1s .38s cubic-bezier(.62, 0, .32, 1) both; }
.pa.stage-open .env-flapwrap { animation: flap-z 1s .38s linear both, env-drop .85s 2.12s cubic-bezier(.5, 0, .75, 0) both; }
.pa.stage-open .env-flap .liner { animation: liner-on 1s .38s linear both; }
.pa.stage-open .env-card { animation: card-out 2.3s 1.18s cubic-bezier(.45, 0, .2, 1) both; }
.pa.stage-open .env-back, .pa.stage-open .env-pocket { animation: env-drop .85s 2.12s cubic-bezier(.5, 0, .75, 0) both; }
.pa.stage-open .over, .pa.stage-open .names { animation: ui-out .55s .25s ease-in both; }
.pa.stage-open .gate { animation: gate-out .75s 3.55s ease-in-out both; }
.pa.stage-open .site { animation: site-in 1.6s 3.4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes flap-open { from { transform: perspective(1100px) rotateX(0deg); } to { transform: perspective(1100px) rotateX(180deg); } }
@keyframes flap-z { 0%, 49.9% { z-index: 4; } 50%, 100% { z-index: 1; } }
@keyframes liner-on { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes env-drop { to { opacity: 0; transform: translateY(150px); } }

/* A · ordinateur 1280 × 800 */
.pa.d { width: 1280px; height: 800px; }
.pa.d .names { margin: 8px 0 28px; font-size: 68px; }
.pa.d .env-wrap { width: 440px; height: 300px; margin-bottom: 30px; }
.pa.d .date { margin-bottom: 22px; }
.pa.d .fl1 { left: -70px; bottom: -48px; width: 380px; --r0: rotate(-20deg); --r1: rotate(0deg); }
.pa.d .fl2 { right: -32px; top: -30px; width: 214px; --r0: rotate(120deg); --r1: rotate(160deg); }
@keyframes card-out {
  0% { transform: none; }
  38% { transform: translateY(-212px); }
  60% { transform: translateY(-212px); }
  100% { transform: translateY(var(--card-y)) scale(var(--card-s)); }
}
.pa.d .env-card { --card-y: 12px; --card-s: 1.42; }

/* A · mobile 390 × 844 */
.pa.m { width: 390px; height: 844px; }
.pa.m .over { font-size: 10px; }
.pa.m .names { margin: 6px 0 26px; font-size: 40px; }
.pa.m .env-wrap { width: 330px; height: 225px; margin-bottom: 26px; }
.pa.m .env-scale { transform: scale(.75); }
.pa.m .date { margin-bottom: 20px; font-size: 17px; }
.pa.m .fl1 { left: -58px; bottom: -34px; width: 220px; --o: .8; --r0: rotate(-20deg); --r1: rotate(0deg); }
.pa.m .fl2 { right: -30px; top: -26px; width: 130px; --o: .85; --r0: rotate(120deg); --r1: rotate(160deg); }
.pa.m .env-card { --card-y: 30px; --card-s: 1.18; }

/* ======================================================= B · Le faire-part à volets */
.pb .gate { perspective: none; }
.pb .door { position: absolute; inset: 0; will-change: transform; }
.pb .door--l { clip-path: inset(0 50% 0 0); transform-origin: 0 50%; }
.pb .door--r { clip-path: inset(0 0 0 50%); transform-origin: 100% 50%; }
.pb .art { position: absolute; inset: 0; background: radial-gradient(85% 70% at 50% 36%, #FFFCF8, #FFF4E8 60%, #F8E3D4); }
.pb .grain { position: absolute; inset: 0; opacity: .5; background: radial-gradient(circle at 20% 30%, rgba(160, 120, 90, .05) 0 1px, transparent 1.5px) 0 0 / 7px 7px, radial-gradient(circle at 70% 60%, rgba(160, 120, 90, .04) 0 1px, transparent 1.5px) 0 0 / 11px 11px; }
.pb .frame { position: absolute; border: 1px solid rgba(194, 24, 91, .34); }
.pb .frame::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(194, 24, 91, .16); }
.pb .sprig { position: absolute; width: 46px; height: 46px; fill: none; stroke: #6B7F5E; stroke-width: 1.2; stroke-linecap: round; opacity: .8; }
.pb .txt { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.pb .tag { font: 500 11.5px/1.6 "Jost", sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #6B7F5E; }
.pb .shade { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.pb .door--l .shade { background: linear-gradient(90deg, rgba(120, 60, 40, .04), rgba(120, 60, 40, .26)); }
.pb .door--r .shade { background: linear-gradient(270deg, rgba(120, 60, 40, .04), rgba(120, 60, 40, .26)); }
.pb .edge { position: absolute; top: 0; bottom: 0; width: 30px; pointer-events: none; }
.pb .door--l .edge { left: calc(50% - 30px); background: linear-gradient(90deg, rgba(120, 80, 60, 0), rgba(120, 80, 60, .08)); }
.pb .door--r .edge { left: 50%; background: linear-gradient(90deg, rgba(120, 80, 60, .08), rgba(120, 80, 60, 0)); }
.pb .seam { position: absolute; top: 0; bottom: 0; left: 50%; z-index: 3; width: 1px; margin-left: -.5px; background: linear-gradient(180deg, transparent, rgba(120, 80, 60, .2) 10%, rgba(120, 80, 60, .2) 90%, transparent); pointer-events: none; }
.pb .ribbon { position: absolute; left: 0; right: 0; z-index: 5; pointer-events: none; }
.pb .rib { position: absolute; top: 0; height: 100%; width: 50%; overflow: hidden; background: linear-gradient(180deg, #7E0B3A 0%, #A3144D 12%, #C8286A 30%, #E0578C 44%, #EB86A9 50%, #D2407A 58%, #B01752 78%, #850C3E 100%); box-shadow: 0 16px 20px -12px rgba(110, 10, 51, .5); }
.pb .rib::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; bottom: 5px; border-top: 1px dashed rgba(255, 214, 229, .38); border-bottom: 1px dashed rgba(255, 214, 229, .38); }
.pb .rib::after { content: ""; position: absolute; top: 0; bottom: 0; width: 42%; left: -45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .26), transparent); animation: satin 6.5s ease-in-out 3.4s infinite; }
.pb .rib--l { left: 0; transform-origin: 0 50%; }
.pb .rib--r { right: 0; transform-origin: 100% 50%; }
.pb .rib--r::after { animation-delay: 3.9s; }
@keyframes satin { 0%, 60% { left: -45%; } 100% { left: 110%; } }
.pb .ui { position: absolute; left: 0; right: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; }
.pb .petals { z-index: 4; }
.pb .fl { z-index: 1; }

/* B · entrée */
.pb.stage-idle .frame { animation: frame-in 1.4s .1s cubic-bezier(.2, .8, .2, 1) both; }
.pb.stage-idle .sprig { animation: fade-in 1.2s .7s both; }
.pb.stage-idle .over { animation: fade-in 1s .45s both; }
.pb.stage-idle .names { animation: ink 1.7s .6s cubic-bezier(.6, 0, .3, 1) both; }
.pb.stage-idle .tag { animation: fade-up .9s 1.35s cubic-bezier(.2, .8, .2, 1) both; }
.pb.stage-idle .date { animation: fade-up .9s 1.5s cubic-bezier(.2, .8, .2, 1) both; }
.pb.stage-idle .rib { animation: rib-in 1.25s 1.15s cubic-bezier(.7, 0, .2, 1) both; }
.pb.stage-idle .seal { animation-delay: 2.15s; }
.pb.stage-idle .ripple { animation-delay: 2.52s; }
.pb.stage-idle .open { animation-delay: 2.6s, 3.9s; }
.pb.stage-idle .note { animation: fade-in .8s 2.8s both; }
.pb.stage-idle .silent { animation: fade-in .8s 2.9s both; }
.pb.stage-idle .fl1 { animation-delay: .3s; }
.pb.stage-idle .fl2 { animation-delay: .5s; }
@keyframes frame-in { from { opacity: 0; transform: scale(.985); } }
@keyframes rib-in { from { transform: scaleX(0); } }

/* B · ouverture : cachet brisé, ruban qui se retire, volets qui s'ouvrent sur le site */
.pb.stage-open .rib--l { animation: rib-out-l .8s .34s cubic-bezier(.6, 0, .4, 1) both; }
.pb.stage-open .rib--r { animation: rib-out-r .8s .34s cubic-bezier(.6, 0, .4, 1) both; }

@keyframes glow { 0% { opacity: 0; transform: scale(0); animation-timing-function: cubic-bezier(.3, .6, .3, 1); } 12% { opacity: 1; } 42% { opacity: 1; transform: scale(1); } 55% { opacity: 1; transform: scale(1); animation-timing-function: ease-in-out; } 100% { opacity: 0; transform: scale(1); } }

<script>
const board = document.getElementById("board");
const tpl = board.innerHTML;
function bind() {
  const root = board.querySelector(".pr");
  const open = () => {
    if (!root.classList.contains("stage-idle")) return;
    root.classList.replace("stage-idle", "stage-open");
    window.__opened = performance.now();
    setTimeout(() => root.classList.replace("stage-open", "stage-done"), 3300);
  };
  root.querySelectorAll(".open, .seal, .silent").forEach((b) => b.addEventListener("click", open));
  root.querySelector(".replay").addEventListener("click", () => { board.innerHTML = tpl; bind(); });
}
bind();
</script></body></html>
